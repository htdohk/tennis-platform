# 远程服务器部署版本
# 使用已有的外部 PostgreSQL 和 Redis 服务
# 与 docker-compose.yml 的区别：不含 postgres/redis 容器

services:
  api:
    image: your-dockerhub-username/tennis-platform-api:latest
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-admin:
    image: your-dockerhub-username/tennis-platform-web-admin:latest
    env_file: .env
    environment:
      PORT: 3001
    ports:
      - "8080:3001"
    restart: unless-stopped
    depends_on:
      - api

  web-customer:
    image: your-dockerhub-username/tennis-platform-web-customer:latest
    env_file: .env
    environment:
      PORT: 3003
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    depends_on:
      - api

  mcp-server:
    image: your-dockerhub-username/tennis-platform-mcp-server:latest
    env_file: .env
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-customer
    restart: unless-stopped
