services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev} -d $${POSTGRES_DB:-tennis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: your-dockerhub-username/tennis-platform-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://dev:dev@postgres:5432/tennis
      REDIS_URL: redis://redis:6379
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web-admin:
    image: your-dockerhub-username/tennis-platform-web-admin:latest
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-测试网球馆}
    environment:
      PORT: 3001
    ports:
      - "8080:3001"
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  web-customer:
    image: your-dockerhub-username/tennis-platform-web-customer:latest
    build:
      context: .
      dockerfile: apps/web-customer/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-测试网球馆}
    environment:
      PORT: 3003
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  mcp-server:
    image: your-dockerhub-username/tennis-platform-mcp-server:latest
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    ports:
      - "3100:3100"
    environment:
      MCP_TRANSPORT: http
      MCP_SERVER_PORT: 3100
      MCP_PATH_PREFIX: /mcp
      INTERNAL_API_BASE_URL: http://api:3000
    env_file: .env
    depends_on:
      - api
    stdin_open: true
    tty: true
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-customer
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
