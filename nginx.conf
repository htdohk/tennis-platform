server {
    listen 80;

    # C 端网页（主域名）
    location / {
        proxy_pass http://web-customer:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API（末尾斜杠会去掉 /api 前缀，将 /api/admin/auth/login → /admin/auth/login）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查（直接转发 API）
    location /health {
        proxy_pass http://api:3000/api/health;
        proxy_set_header Host $host;
    }

    # MCP Server (SSE - needs buffering off for streaming)
    location /mcp/ {
        proxy_pass http://mcp-server:3100/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }
}
